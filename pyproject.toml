[project]
name = "tellwater"
version = "0.1.0"
description = "Investigates whether a factory's wastewater treatment claim is supported by physical evidence."
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5",
    "pandas>=3.1",
    "pydantic>=2.9,<2.13",  # fireworks-ai[training] pins below 2.13
    "pyyaml>=6.0",
    "openai>=3.0",
    "pillow>=13.0",
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sim*", "core*", "agent*", "store*", "review*", "passport*", "eval*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
