<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Tellwater companion, gamchha swatch G1, mood: asking.
       Groups: shadow; rig (breath/hop, pivot 256,486) > feet, fray strands, body, ring (cord pivot 160,116),
       head (pivot 256,340) > face (plate, blush, eyes, brows, mouth), props, arm_left (pivot 134,300), arm_right (pivot 406,250), thread (pivot 414,96). -->
  <style>
.rig{transform-box:view-box;transform-origin:256px 486px;animation:breath 3.6s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(1,1)}50%{transform:scale(.99,1.022)}}
.shadow{transform-box:view-box;transform-origin:256px 486px;animation:shadowb 3.6s ease-in-out infinite}
@keyframes shadowb{50%{transform:scaleX(.97)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
.strand{transform-box:view-box;animation:flutter 2.6s ease-in-out infinite}
@keyframes flutter{0%,100%{transform:rotate(0)}30%{transform:rotate(16deg)}60%{transform:rotate(-7deg)}}
.cord{transform-box:view-box;transform-origin:160px 116px;animation:cord 3.4s ease-in-out infinite}
@keyframes cord{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
.head{transform-box:view-box;transform-origin:256px 340px}
.thread{transform-box:view-box;transform-origin:414px 96px}
.arm-l{transform-box:view-box;transform-origin:134px 300px}
.arm-r{transform-box:view-box;transform-origin:406px 250px}
.pop{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.q{transform-box:view-box;transform-origin:414px 96px;animation:qpop 4.4s cubic-bezier(.34,1.56,.64,1) infinite}@keyframes qpop{0%{transform:scale(.1) rotate(-25deg);opacity:0}8%{opacity:1}20%{transform:scale(1.12) rotate(8deg);opacity:1}30%{transform:scale(.96) rotate(-5deg);opacity:1}40%{transform:scale(1) rotate(0);opacity:1}62%{transform:scale(1) rotate(3deg);opacity:1}84%{transform:scale(1) rotate(0);opacity:1}94%,100%{transform:scale(.1) rotate(-25deg);opacity:0}}.dot{animation:dotpop 4.4s cubic-bezier(.34,1.56,.64,1) infinite}@keyframes dotpop{0%,22%{transform:scale(0)}32%{transform:scale(1.3)}40%,84%{transform:scale(1)}92%,100%{transform:scale(0)}}.head{animation:tilt 4.4s ease-in-out infinite}@keyframes tilt{0%,6%{transform:rotate(0)}22%,84%{transform:rotate(-7deg)}96%,100%{transform:rotate(0)}}.mouth{transform-box:fill-box;transform-origin:center;animation:ooh 4.4s ease-in-out infinite}@keyframes ooh{0%,18%{transform:scale(.6)}30%,84%{transform:scale(1)}96%,100%{transform:scale(.6)}}.arm-r{animation:wave 4.4s ease-in-out infinite}@keyframes wave{0%,15%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}35%{transform:rotate(6deg)}45%{transform:rotate(0)}}*{animation:none!important}</style>
